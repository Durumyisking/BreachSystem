<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>R6 파괴 강연 · 화면과 자막</title>
<style>
:root{color-scheme:dark;--bg:#111719;--panel:#192225;--line:#344246;--text:#edf2ef;--muted:#acbbb9;--accent:#91d9bf}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 "Malgun Gothic",sans-serif}a{color:var(--accent)}button,input,select{font:inherit}button,select,input{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px}button{cursor:pointer}button:hover{border-color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}header{padding:18px 26px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:22px;flex-wrap:wrap}header strong{font-size:19px}header small{color:var(--muted)}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 81px)}aside{padding:18px;border-right:1px solid var(--line);overflow:auto}input{width:100%;margin-bottom:12px}#count{font-size:12px;color:var(--muted);margin-bottom:12px}.scene{display:block;width:100%;text-align:left;border:0;border-radius:5px;margin:0 0 3px;padding:10px 12px;background:transparent;line-height:1.5}.scene span{display:block;color:var(--muted);font-size:12px}.scene.active{background:#244a41;color:#c6f5e1}.scene b{font-size:13px}main{overflow:auto;padding:20px 26px 42px;min-width:0}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.controls a{margin-left:auto}#position{color:var(--muted);font-size:13px}h1{font-size:23px;line-height:1.4;margin:17px 0 12px}figure{margin:0}#frameButton{display:block;border:0;background:#080c0d;padding:0;width:100%;border-radius:6px;overflow:hidden;cursor:zoom-in}#frame{display:block;width:100%;height:48vh;max-height:540px;object-fit:contain}figcaption{font-size:12px;color:var(--muted);padding:7px 0}.detail{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px;margin-top:15px}h2{font-size:16px;margin:0 0 9px}.caption{display:block;width:100%;text-align:left;padding:13px 15px;border:1px solid var(--line);margin:0 0 8px;line-height:1.9}.caption.active{border-color:var(--accent);background:#213b34}.caption span{display:block;color:var(--accent);font-size:12px;margin-bottom:5px}.caption p{margin:0}.shots{display:grid;grid-template-columns:1fr;gap:9px;align-content:start}.shot{padding:0;overflow:hidden;text-align:left}.shot img{width:100%;display:block;aspect-ratio:16/9;object-fit:contain}.shot span{display:block;font-size:12px;padding:3px 7px;color:var(--muted)}.note{font-size:12px;color:var(--muted);margin:0 0 14px}.empty{color:var(--muted)}dialog{max-width:97vw;width:1320px;border:1px solid var(--line);padding:12px;background:var(--bg);color:var(--text);border-radius:8px}dialog img{width:100%;display:block;margin-top:10px}dialog::backdrop{background:#000d}.mobile{display:none}@media(min-width:1500px){main{padding-left:4vw;padding-right:4vw}}@media(max-width:850px){header{padding:12px 16px;gap:4px 16px}.layout{height:auto;display:block}aside{border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}#scenes{max-height:210px;overflow:auto}.scene{padding:7px 10px}.detail{grid-template-columns:1fr}.shots{grid-template-columns:repeat(3,minmax(0,1fr))}main{padding:16px}.controls a{margin-left:0}h1{font-size:20px}.mobile{display:inline}}@media print{aside,.controls,header,dialog{display:none}.layout{display:block;height:auto}main{overflow:visible}.detail{grid-template-columns:1fr}.shots{display:none}}
</style>
</head>
<body>
<header><strong>R6 파괴 강연 · 화면과 자막</strong><small id="summary"></small><a href="../index.html">기존 분석 문서</a></header>
<div class="layout">
<aside aria-label="장면 탐색"><label for="search">슬라이드 제목 · 한국어 자막 검색</label><input type="search" id="search" placeholder="예: 삼각분할, 커터, 결정론"><div id="count" aria-live="polite"></div><nav id="scenes" aria-label="장면 목록"></nav></aside>
<main>
<div class="controls"><button id="prev" aria-label="이전 장면">← 이전</button><span id="position"></span><button id="next" aria-label="다음 장면">다음 →</button><a id="youtube" target="_blank" rel="noopener">이 시간부터 영상 보기 ↗</a></div>
<h1 id="title"></h1>
<figure><button id="frameButton" aria-label="영상 전체 화면 확대"><img id="frame" alt=""></button><figcaption id="frameInfo"></figcaption></figure>
<div class="detail"><section aria-labelledby="subtitleTitle"><h2 id="subtitleTitle">이 장면의 한국어 자막</h2><p class="note">자막을 누르면 해당 시간의 전체 영상 캡처로 바뀝니다. 제공된 번역은 약 15초 단위이며, 장면 경계는 약 5초 단위입니다. 전환에 걸친 자막은 양쪽 장면에 표시됩니다.</p><div id="captions"></div></section><section aria-labelledby="shotsTitle"><h2 id="shotsTitle">장면 안의 캡처</h2><div id="shots" class="shots"></div></section></div>
</main>
</div>
<dialog id="zoom"><button id="close">닫기 · Esc</button><img id="large" alt=""></dialog>
<script>
const study = /*STUDY_DATA*/;
const $ = id => document.getElementById(id);
const stamp = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
let current=0, selected=null;
$('summary').textContent=study.scenes.length+'개 장면 · '+study.captions.length+'개 자막 · 원본 1280 × 720';
function showFrame(item){$('frame').src=item.image;$('frame').alt=study.scenes[current].title+' · 영상 '+stamp(item.shot);$('frameInfo').textContent='영상 '+stamp(item.shot)+(item.shot%1?' (+0.5초)':'')+'의 실제 전체 화면 · 클릭하면 확대';$('youtube').href='https://www.youtube.com/watch?v='+study.video+'&t='+Math.floor(item.shot)+'s';document.querySelectorAll('.caption').forEach(b=>b.classList.toggle('active',Number(b.dataset.caption)===selected));}
function renderList(){const q=$('search').value.trim().toLowerCase();const scenes=study.scenes.filter(s=>(s.title+' '+stamp(s.start)+' '+s.captions.map(i=>study.captions[i].text).join(' ')).toLowerCase().includes(q));$('scenes').replaceChildren();for(const s of scenes){const b=document.createElement('button');b.className='scene'+(s.id===current?' active':'');b.dataset.scene=s.id;b.setAttribute('aria-current',s.id===current?'true':'false');const small=document.createElement('span');small.textContent=String(s.id+1).padStart(2,'0')+' · 약 '+stamp(s.start);const title=document.createElement('b');title.textContent=s.title;b.append(small,title);b.onclick=()=>selectScene(s.id);$('scenes').append(b)}$('count').textContent=scenes.length+' / '+study.scenes.length+'개 장면';}
function selectCaption(c){selected=c.id;showFrame(c);history.replaceState(null,'','#scene='+current+'&caption='+c.id);}
function selectScene(index,captionId=null){current=Math.max(0,Math.min(study.scenes.length-1,index));selected=null;const s=study.scenes[current];$('title').textContent=s.title;$('position').textContent=(current+1)+' / '+study.scenes.length;$('prev').disabled=current===0;$('next').disabled=current===study.scenes.length-1;$('captions').replaceChildren();$('shots').replaceChildren();for(const id of s.captions){const c=study.captions[id];const b=document.createElement('button');b.className='caption';b.dataset.caption=id;const t=document.createElement('span');t.textContent=stamp(c.start)+'–'+stamp(c.end);const p=document.createElement('p');p.textContent=c.text;b.append(t,p);b.onclick=()=>selectCaption(c);$('captions').append(b)}if(!s.captions.length){const p=document.createElement('p');p.className='empty';p.textContent='제공된 TXT에 이 구간의 자막이 없습니다.';$('captions').append(p)}const shots=[s,...s.captions.map(i=>study.captions[i]).filter(c=>c.shot>=s.start&&c.shot<s.end)];for(const item of shots){const b=document.createElement('button');b.className='shot';const im=document.createElement('img');im.src=item.image;im.loading='lazy';im.alt=stamp(item.shot)+' 전체 영상 캡처';const time=document.createElement('span');time.textContent=stamp(item.shot);b.append(im,time);b.onclick=()=>{if(item.text)selectCaption(item);else{selected=null;showFrame(item)}};$('shots').append(b)}showFrame(s);if(captionId!==null&&s.captions.includes(captionId))selectCaption(study.captions[captionId]);else history.replaceState(null,'','#scene='+current);renderList();}
$('prev').onclick=()=>selectScene(current-1);$('next').onclick=()=>selectScene(current+1);$('search').oninput=renderList;$('frameButton').onclick=()=>{$('large').src=$('frame').src;$('large').alt=$('frame').alt;$('zoom').showModal()};$('close').onclick=()=>$('zoom').close();$('zoom').onclick=e=>{if(e.target===$('zoom'))$('zoom').close()};document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select')||$('zoom').open)return;if(e.key==='ArrowRight'){e.preventDefault();selectScene(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();selectScene(current-1)}});const params=new URLSearchParams(location.hash.slice(1));const requested=Number(params.get('scene'));selectScene(Number.isFinite(requested)?requested:0,params.has('caption')?Number(params.get('caption')):null);
</script>
</body>
</html>
